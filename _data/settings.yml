#-------------------------------
# Portfolio Settings
portfolio:
  portfolio__title: Portfolio
  # Filters (All + below). `filters` may list multiple slugs - item shows when any tab matches.
  # geospatial - maps / 3D / spatial data
  # svelte - Svelte/React component-style UI
  # d3 - Interactive D3.js (most charts); can combine with bi (e.g. treemap = bi + d3)
  # bi - BI & Analytics - business/reporting focus (same project may be bi + d3)
  portfolio_filter_categories:
    - { slug: geospatial, label: Geospatial & 3D }
    - { slug: svelte, label: Svelte & React }
    - { slug: d3, label: Interactive D3.js }
    - { slug: bi, label: BI & Analytics }
  # "All" grid order: first three tiles = 3D Map → Globe → Treemap (BI)
  portfolio__gallery:
    - image: /images/projects/Geospatial3D/Geospatial.mp4
      video: /images/projects/Geospatial3D/Geospatial.mp4
      title: Geospatial 3D Visualizer
      description: Interactive 3D map with Mapbox, search, and education layers
      filters: [geospatial]
    - image: /images/projects/globe/globe.mp4
      video: /images/projects/globe/globe.mp4
      title: Globe Visualization
      description: Interactive globe visualization with Svelte and Plotly
      filters: [geospatial, svelte, d3]
    - image: /images/projects/treemap/treemap.mp4
      video: /images/projects/treemap/treemap.mp4
      title: Treemap Chart Visualization
      description: Interactive treemap visualization with D3.js
      filters: [bi, d3]
    - image: /images/projects/chord/chord.mp4
      video: /images/projects/chord/chord.mp4
      media_cache_bust: 4
      title: Chord Chart Visualization
      description: Interactive chord diagram visualization with D3.js
      filters: [d3]
    - image: /images/projects/bubble/bubble.mp4
      video: /images/projects/bubble/bubble.mp4
      title: Bubble Chart Visualization
      description: Interactive bubble chart visualization with D3.js
      filters: [bi, d3]
    - image: /images/projects/network/network.mp4
      video: /images/projects/network/network.mp4
      title: Network Chart Visualization
      description: Interactive network graph visualization with D3.js
      filters: [d3]
    - image: /images/projects/gantt/gantt.mp4
      video: /images/projects/gantt/gantt.mp4
      title: Gantt Chart Visualization
      description: Interactive Gantt chart visualization with D3.js
      filters: [bi, d3]
    - image: /images/projects/radar/radar.mp4
      video: /images/projects/radar/radar.mp4
      title: Radar Chart Visualization
      description: Interactive radar chart visualization with D3.js and Svelte
      filters: [d3, svelte]
    - image: /images/projects/fan/fan.mp4
      video: /images/projects/fan/fan.mp4
      title: Fan Chart Visualization
      description: Interactive fan chart visualization with D3.js and Svelte
      filters: [d3, svelte]
    - image: /images/projects/spike/spike.mp4
      video: /images/projects/spike/spike.mp4
      title: Spike Chart Visualization
      description: Interactive spike chart visualization with D3.js and Svelte
      filters: [svelte, d3]
    - image: /images/projects/line/line.mp4
      video: /images/projects/line/line.mp4
      title: Line Chart Visualization
      description: Interactive line chart visualization with D3.js and Svelte
      filters: [bi, svelte, d3]
    - image: /images/projects/bar/bar.mp4
      video: /images/projects/bar/bar.mp4
      title: Grouped Bar Chart Visualization
      description: Interactive grouped bar chart visualization with D3.js and Svelte
      filters: [bi, svelte, d3]
    - image: /images/projects/timeline/timeline.mp4
      video: /images/projects/timeline/timeline.mp4
      title: Timeline Chart Visualization
      description: Interactive timeline chart visualization with D3.js and Svelte
      filters: [bi, svelte, d3]


